apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/envoyproxy/gateway/releases # Update to the actual Helm repo URL
    chart: gateway-helm
    targetRevision: "v1.4.0" # Avoid wildcards if possible; use specific versions for stability
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # FIX: Allows handling of immutable fields by using SSA
  ignoreDifferences:        # FIX: Prevents ArgoCD from trying to patch large annotations
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
